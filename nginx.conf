events {
    worker_connections  1024;
}

http {
    # --------------------------
    # 1. Общие настройки
    # --------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------
    # 2. Защита от DDoS
    # --------------------------
    # Ограничение скорости запросов по IP
    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;
    # Ограничение числа одновременных соединений по IP
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # --------------------------
    # 3. Upstream-блоки
    # --------------------------
    upstream backend_rr {
        # round-robin (по-умолчанию)
        server app1:8000 weight=2 max_fails=3  fail_timeout=30s;
        server app2:8000 weight=1 max_fails=3  fail_timeout=30s;
    }

    upstream backend_least {
        least_conn;   # наименьшее число активных соединений
        server app1:8000;
        server app2:8000;
    }

    upstream backend_ip_hash {
        ip_hash;      # “липкая” привязка по IP
        server app1:8000;
        server app2:8000;
    }

    # --------------------------
    # 4. Сервис метрик (stub_status)
    # --------------------------
    server {
        listen 8080;              # порт для метрик
        server_name _;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;      # разрешён доступ только локально
            allow 172.24.0.0/16;
            deny all;
        }
    }

    # --------------------------
    # 5. Основной HTTP-сервер
    # --------------------------
    server {
        listen 80;
        server_name _;

        # применяем rate- и conn-limit для всех локаций
        limit_req   zone=req_zone burst=20 nodelay;
        limit_conn  conn_zone 50;

        # проксирование с разными алгоритмами
        location /rr/ {
            proxy_pass http://backend_rr/;

             # 1) Время на установление TCP-соединения с бэкендом
            proxy_connect_timeout 2s;

            # 2) Время ожидания полного отправления запроса на бэкенд
            proxy_send_timeout   3s;

            # 3) Время ожидания ответа от бэкенда (между пакетами)
            proxy_read_timeout   5s;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /least/ {
            proxy_pass http://backend_least/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ip/ {
            proxy_pass http://backend_ip_hash/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # общий прокси-блок (например, для API)
        location / {
            proxy_pass http://backend_rr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # --------------------------
    # 6. Дополнительные include
    # --------------------------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
